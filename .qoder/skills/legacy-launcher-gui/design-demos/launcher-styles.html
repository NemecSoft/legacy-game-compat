<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>启动器 GUI 风格探索 · 10 方向</title>
  <style>
/* ------------------------------------------------------------
   Page canvas
------------------------------------------------------------ */
:root {
  --page-bg: #0d0e11;
  --page-ink: #f3f0e8;
  --page-muted: #8e8a80;
  --page-line: rgba(255, 255, 255, .09);
  --page-accent: #d94a3a;
  --page-font: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
  --page-mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
}

* { box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  margin: 0;
  color: var(--page-ink);
  background:
    radial-gradient(1000px 560px at 18% -8%, rgba(255, 255, 255, .055), transparent 62%),
    linear-gradient(rgba(255, 255, 255, .028) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255, 255, 255, .028) 1px, transparent 1px),
    var(--page-bg);
  background-size: auto, 56px 56px, 56px 56px, auto;
  font-family: var(--page-font);
  -webkit-font-smoothing: antialiased;
}

.page-head {
  max-width: 1120px;
  margin: 0 auto;
  padding: 72px 28px 0;
}

.page-mark {
  display: flex;
  align-items: center;
  gap: 10px;
  font: 12px/1 var(--page-mono);
  letter-spacing: .14em;
  color: var(--page-muted);
}

.page-mark::before {
  content: "";
  width: 9px;
  height: 9px;
  background: var(--page-accent);
}

h1 {
  margin: 28px 0 22px;
  font-size: clamp(44px, 6.2vw, 82px);
  line-height: 1.02;
  letter-spacing: -.045em;
  font-weight: 800;
}

h1 span {
  color: #c8c1b4;
  font-weight: 300;
}

.page-lead {
  max-width: 700px;
  margin: 0;
  font-size: 17px;
  line-height: 1.8;
  color: #c7c1b5;
}

.page-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 10px 22px;
  margin-top: 26px;
  padding-top: 18px;
  border-top: 1px solid var(--page-line);
  font: 12px/1.4 var(--page-mono);
  color: var(--page-muted);
}

.page-meta span::before {
  content: "·";
  margin-right: 8px;
  color: var(--page-accent);
}

.style-index {
  position: sticky;
  top: 0;
  z-index: 30;
  display: flex;
  gap: 4px;
  overflow-x: auto;
  padding: 14px 0;
  margin-top: 40px;
  border-bottom: 1px solid var(--page-line);
  background: rgba(13, 14, 17, .86);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  scrollbar-width: none;
}

.style-index::-webkit-scrollbar { display: none; }

.style-index a {
  flex: 0 0 auto;
  display: flex;
  align-items: baseline;
  gap: 6px;
  padding: 8px 10px;
  color: var(--page-muted);
  text-decoration: none;
  font-size: 13px;
  border-radius: 4px;
}

.style-index a b {
  font: 11px var(--page-mono);
  color: #6f6a60;
}

.style-index a:hover {
  color: var(--page-ink);
  background: rgba(255, 255, 255, .05);
}

.style-index a.is-active {
  color: var(--page-ink);
  background: rgba(255, 255, 255, .09);
}

.gallery {
  max-width: 1120px;
  margin: 0 auto;
  padding: 44px 28px 96px;
  display: flex;
  flex-direction: column;
  gap: 84px;
}

.style-block { scroll-margin-top: 78px; }

.style-meta {
  display: grid;
  grid-template-columns: 52px minmax(200px, 1.1fr) minmax(260px, 1.6fr) auto;
  align-items: end;
  gap: 18px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--page-line);
}

.style-no {
  font: 12px var(--page-mono);
  color: var(--page-accent);
  letter-spacing: .08em;
}

.style-name h2 {
  margin: 0;
  font-size: 24px;
  letter-spacing: -.02em;
}

.style-name span {
  display: block;
  margin-top: 4px;
  font: 11px var(--page-mono);
  letter-spacing: .12em;
  color: var(--page-muted);
}

.style-desc {
  margin: 0;
  color: #b6b0a4;
  font-size: 14px;
  line-height: 1.6;
}

.swatches {
  display: flex;
  gap: 6px;
  justify-content: flex-end;
}

.swatches i {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--c);
  box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .25);
}

.mockup-frame {
  position: relative;
  margin-top: 20px;
  border-radius: 16px;
  overflow: hidden;
  background: #111;
  box-shadow: 0 24px 60px rgba(0, 0, 0, .35);
  border: 1px solid rgba(255, 255, 255, .08);
}

.mockup-frame.is-scroll {
  overflow-x: auto;
  overflow-y: hidden;
}

.mockup-frame.is-scroll .mockup { transform: none !important; }

.mockup {
  position: relative;
  width: 1080px;
  height: 720px;
  transform-origin: top left;
}

.page-foot {
  max-width: 1120px;
  margin: 0 auto;
  padding: 22px 28px 48px;
  display: flex;
  justify-content: space-between;
  gap: 16px;
  border-top: 1px solid var(--page-line);
  color: var(--page-muted);
  font: 12px var(--page-mono);
}

.page-foot a {
  color: #c9c3b7;
  text-decoration: none;
}

body.single-style .page-head,
body.single-style .page-foot,
body.single-style .style-index {
  display: none;
}

body.single-style .gallery {
  padding-top: 26px;
  gap: 0;
}

body.single-style .style-block { scroll-margin-top: 0; }

@media (max-width: 860px) {
  .page-head { padding-top: 44px; }
  .page-lead { font-size: 15px; }
  .style-meta {
    grid-template-columns: 40px 1fr;
    gap: 10px 14px;
    align-items: start;
  }
  .style-desc { grid-column: 2 / -1; font-size: 13px; }
  .swatches { grid-column: 2 / -1; justify-content: flex-start; }
  .gallery { padding-left: 16px; padding-right: 16px; gap: 60px; }
  .mockup-frame.is-scroll { border-radius: 12px; }
  .page-foot { flex-direction: column; }
}

/* ------------------------------------------------------------
   Shared mockup shell
------------------------------------------------------------ */
.mockup {
  --font-ui: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
  --font-mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
  --font-serif: "STSong", "SimSun", "Songti SC", Georgia, serif;
  --app-inset: 0px;
  --app-bg: #15171c;
  --app-border: 0;
  --app-radius: 0;
  --app-shadow: none;
  --ink: #f5f5f2;
  --ink-soft: rgba(245, 245, 242, .8);
  --muted: rgba(245, 245, 242, .52);
  --accent: #ffffff;
  --note-line: rgba(255, 255, 255, .08);
  --pane-bg: rgba(255, 255, 255, .06);
  --pane-border: 1px solid rgba(255, 255, 255, .1);
  --pane-radius: 12px;
  --pane-shadow: none;
  --control-radius: 8px;
  --btn-bg: rgba(255, 255, 255, .08);
  --btn-border: 1px solid rgba(255, 255, 255, .14);
  --btn-shadow: none;
  --primary-bg: #ffffff;
  --primary-ink: #111111;
  --primary-border: 0;
  --primary-shadow: none;
  --select-bg: rgba(255, 255, 255, .06);
  --select-border: 1px solid rgba(255, 255, 255, .14);
  --select-shadow: none;
  --kbd-bg: rgba(255, 255, 255, .1);
  --kbd-border: 1px solid rgba(255, 255, 255, .18);
  --kbd-shadow: none;
  --kbd-radius: 5px;
  --kbd-ink: #ffffff;
  --status: #7bd88f;
  --status-glow: rgba(123, 216, 143, .18);
  --brand: #ffffff;
  --foot-border: 1px solid rgba(255, 255, 255, .08);
  --dot: rgba(255, 255, 255, .32);
  font-family: var(--font-ui);
  color: var(--ink);
  background: #111318;
  overflow: hidden;
}

.mockup .app {
  position: absolute;
  inset: var(--app-inset);
  z-index: 1;
  display: flex;
  flex-direction: column;
  background: var(--app-bg);
  border: var(--app-border);
  border-radius: var(--app-radius);
  box-shadow: var(--app-shadow);
  overflow: hidden;
}

.mockup .winbar {
  flex: 0 0 30px;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 14px;
  color: var(--muted);
}

.mockup .win-dots {
  display: flex;
  gap: 6px;
}

.mockup .win-dots i {
  display: block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--dot);
}

.mockup .win-title {
  font-size: 11px;
  letter-spacing: .04em;
  color: var(--muted);
}

.mockup .win-meta {
  margin-left: auto;
  font-size: 10px;
  letter-spacing: .14em;
  color: var(--muted);
  opacity: .75;
}

.mockup .app-head {
  flex: 0 0 auto;
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 8px 26px 10px;
}

.mockup .app-title {
  font-size: 30px;
  line-height: 1.05;
  font-weight: 800;
  letter-spacing: -.02em;
  color: var(--ink);
}

.mockup .app-sub {
  font-size: 10.5px;
  letter-spacing: .12em;
  color: var(--muted);
}

.mockup .app-body {
  flex: 1;
  min-height: 0;
  display: grid;
  grid-template-columns: 300px minmax(0, 1fr) 310px;
  gap: 18px;
  padding: 16px 26px 12px;
}

.mockup .pane {
  min-width: 0;
  min-height: 0;
  padding: 16px;
  background: var(--pane-bg);
  border: var(--pane-border);
  border-radius: var(--pane-radius);
  box-shadow: var(--pane-shadow);
  overflow: hidden;
}

.mockup .pane-left,
.mockup .pane-center,
.mockup .pane-right {
  display: flex;
  flex-direction: column;
}

.mockup .kicker {
  margin-bottom: 8px;
  font-size: 11px;
  line-height: 1.2;
  font-weight: 700;
  letter-spacing: .12em;
  color: var(--accent);
}

.mockup .intro {
  margin: 0 0 10px;
  font-size: 14px;
  line-height: 1.65;
  color: var(--ink-soft);
}

.mockup .left-foot {
  margin-top: auto;
  padding-top: 14px;
  border-top: var(--foot-border);
}

.mockup p {
  margin: 0;
  font-size: 13.5px;
  line-height: 1.55;
  color: var(--ink-soft);
}

.mockup .launch-notes {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.mockup .launch-note {
  padding-bottom: 9px;
  border-bottom: 1px solid var(--note-line);
}

.mockup .launch-note:last-child {
  padding-bottom: 0;
  border-bottom: 0;
}

.mockup .note-title {
  margin-bottom: 2px;
  font-size: 14px;
  font-weight: 700;
  line-height: 1.3;
  color: var(--ink);
}

.mockup .note-text {
  font-size: 13px;
  line-height: 1.5;
  color: var(--ink-soft);
}

.mockup .launch-controls { margin-top: 14px; }

.mockup .field-label {
  margin-bottom: 6px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .12em;
  color: var(--muted);
}

.mockup .select {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 38px;
  padding: 0 12px;
  background: var(--select-bg);
  border: var(--select-border);
  border-radius: var(--control-radius);
  box-shadow: var(--select-shadow);
  font-size: 13.5px;
  color: var(--ink);
}

.mockup .chev {
  color: var(--muted);
  font-size: 14px;
}

.mockup .btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 34px;
  padding: 0 12px;
  background: var(--btn-bg);
  border: var(--btn-border);
  border-radius: var(--control-radius);
  box-shadow: var(--btn-shadow);
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: 12px;
  font-weight: 600;
  line-height: 1;
  cursor: default;
}

.mockup .btn-primary {
  width: 100%;
  height: 46px;
  margin-top: 10px;
  background: var(--primary-bg);
  border: var(--primary-border);
  border-radius: var(--control-radius);
  box-shadow: var(--primary-shadow);
  color: var(--primary-ink);
  font-family: var(--font-ui);
  font-size: 15px;
  font-weight: 800;
  line-height: 1;
}

.mockup .btn-row {
  display: grid;
  grid-template-columns: 1.05fr 1.35fr .8fr;
  gap: 7px;
  margin-top: 9px;
}

.mockup .pane-right .small {
  font-size: 12px;
  line-height: 1.6;
  color: var(--ink-soft);
}

.mockup .ops { margin-top: 14px; }

.mockup .keyrow {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  min-height: 28px;
  border-bottom: 1px solid var(--note-line);
  font-size: 12.5px;
  color: var(--ink-soft);
}

.mockup .keys {
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-end;
  gap: 3px;
}

.mockup kbd {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 24px;
  height: 22px;
  padding: 0 5px;
  background: var(--kbd-bg);
  border: var(--kbd-border);
  border-radius: var(--kbd-radius);
  box-shadow: var(--kbd-shadow);
  color: var(--kbd-ink);
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 600;
  line-height: 1;
}

.mockup .core-tip { margin-top: 12px; color: var(--ink-soft); }

.mockup .tips { margin-top: 12px; }
.mockup .tips .kicker { margin-bottom: 4px; }

.mockup .app-foot {
  flex: 0 0 38px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 0 26px;
  border-top: var(--foot-border);
  font-size: 11px;
  color: var(--muted);
}

.mockup .status {
  display: flex;
  align-items: center;
  gap: 6px;
}

.mockup .status i {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--status);
  box-shadow: 0 0 0 3px var(--status-glow);
}

.mockup .brand {
  font-size: 16px;
  font-weight: 800;
  letter-spacing: .04em;
  color: var(--brand);
}

.mockup .hint { font-size: 10.5px; }

.mockup .ornament {
  position: absolute;
  z-index: 0;
  pointer-events: none;
}

/* ------------------------------------------------------------
   01 · Neumorphism
------------------------------------------------------------ */
.m-neumorph {
  --font-ui: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
  --app-inset: 0px;
  --app-bg: #e6edf5;
  --app-border: 0;
  --app-radius: 0;
  --app-shadow: none;
  --ink: #334155;
  --ink-soft: #536579;
  --muted: #71839a;
  --accent: #5b7cfa;
  --note-line: #cfd9e5;
  --pane-bg: #e6edf5;
  --pane-border: 0;
  --pane-radius: 22px;
  --pane-shadow: 12px 12px 24px #c3cedb, -12px -12px 24px #ffffff;
  --control-radius: 14px;
  --btn-bg: #e6edf5;
  --btn-border: 0;
  --btn-shadow: 5px 5px 10px #c3cedb, -5px -5px 10px #ffffff;
  --primary-bg: linear-gradient(135deg, #6d8cff, #4f6ef0);
  --primary-ink: #ffffff;
  --primary-border: 0;
  --primary-shadow: 8px 8px 18px #b9c5d4, -8px -8px 18px #ffffff;
  --select-bg: #e6edf5;
  --select-border: 0;
  --select-shadow: inset 5px 5px 10px #c3cedb, inset -5px -5px 10px #ffffff;
  --kbd-bg: #e6edf5;
  --kbd-border: 0;
  --kbd-shadow: 3px 3px 6px #c3cedb, -3px -3px 6px #ffffff;
  --kbd-ink: #415169;
  --kbd-radius: 7px;
  --status: #2f9e63;
  --status-glow: rgba(47, 158, 99, .16);
  --brand: #415169;
  --foot-border: 1px solid #d3dde8;
  --dot: #c3cedb;
  background: radial-gradient(1100px 700px at 18% 0%, #f3f7fb, #e6edf5 62%);
}

.m-neumorph .app-head { padding-top: 12px; }
.m-neumorph .app-title { color: #2f3e51; letter-spacing: -.03em; }
.m-neumorph .app-sub { color: #7c8ea3; }
.m-neumorph .kicker { color: #5b7cfa; }
.m-neumorph .app-foot { border-top: 1px solid #d3dde8; }
.m-neumorph .btn-primary { text-shadow: 0 1px 0 rgba(255, 255, 255, .2); }

/* ------------------------------------------------------------
   02 · Glassmorphism
------------------------------------------------------------ */
.m-glass {
  --font-ui: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
  --app-inset: 16px;
  --app-bg: rgba(12, 16, 38, .52);
  --app-border: 1px solid rgba(255, 255, 255, .28);
  --app-radius: 24px;
  --app-shadow: 0 30px 80px rgba(0, 0, 0, .35), inset 0 1px 0 rgba(255, 255, 255, .2);
  --ink: #f7f8ff;
  --ink-soft: rgba(247, 248, 255, .82);
  --muted: rgba(247, 248, 255, .58);
  --accent: #83f4ff;
  --note-line: rgba(255, 255, 255, .14);
  --pane-bg: rgba(255, 255, 255, .09);
  --pane-border: 1px solid rgba(255, 255, 255, .24);
  --pane-radius: 18px;
  --pane-shadow: 0 18px 40px rgba(0, 0, 0, .18), inset 0 1px 0 rgba(255, 255, 255, .16);
  --control-radius: 12px;
  --btn-bg: rgba(255, 255, 255, .1);
  --btn-border: 1px solid rgba(255, 255, 255, .22);
  --primary-bg: linear-gradient(135deg, rgba(255, 255, 255, .92), rgba(190, 255, 255, .82));
  --primary-ink: #1a1740;
  --primary-border: 1px solid rgba(255, 255, 255, .6);
  --primary-shadow: 0 12px 30px rgba(120, 230, 255, .25);
  --select-bg: rgba(255, 255, 255, .08);
  --select-border: 1px solid rgba(255, 255, 255, .24);
  --select-shadow: inset 0 1px 0 rgba(255, 255, 255, .14);
  --kbd-bg: rgba(255, 255, 255, .12);
  --kbd-border: 1px solid rgba(255, 255, 255, .25);
  --kbd-ink: #ffffff;
  --status: #7ef2c4;
  --status-glow: rgba(126, 242, 196, .2);
  --brand: #ffffff;
  --foot-border: 1px solid rgba(255, 255, 255, .14);
  --dot: rgba(255, 255, 255, .7);
  background:
    radial-gradient(620px 420px at 8% 10%, rgba(124, 77, 255, .9), transparent 70%),
    radial-gradient(700px 500px at 92% 20%, rgba(0, 229, 255, .75), transparent 70%),
    linear-gradient(135deg, #2a145c 0%, #1b2a7a 45%, #0e6f8f 100%);
}

.m-glass::before,
.m-glass::after {
  content: "";
  position: absolute;
  z-index: 0;
  border-radius: 50%;
  filter: blur(22px);
  opacity: .7;
}

.m-glass::before {
  width: 320px;
  height: 320px;
  left: 120px;
  bottom: 60px;
  background: radial-gradient(circle, rgba(255, 110, 230, .9), transparent 70%);
}

.m-glass::after {
  width: 260px;
  height: 260px;
  right: 140px;
  bottom: 120px;
  background: radial-gradient(circle, rgba(80, 255, 240, .8), transparent 70%);
}

.m-glass .app,
.m-glass .pane {
  backdrop-filter: blur(22px) saturate(140%);
  -webkit-backdrop-filter: blur(22px) saturate(140%);
}

.m-glass .app-title { letter-spacing: -.03em; }
.m-glass .win-dots i { box-shadow: 0 0 12px rgba(255, 255, 255, .4); }
.m-glass .kicker { color: #9af8ff; }
.m-glass .app-foot { background: rgba(255, 255, 255, .04); }

/* ------------------------------------------------------------
   03 · Cyberpunk
------------------------------------------------------------ */
.m-cyber {
  --font-ui: "Consolas", "Microsoft YaHei", monospace;
  --font-mono: Consolas, "Courier New", monospace;
  --app-inset: 12px;
  --app-bg: rgba(4, 8, 11, .94);
  --app-border: 1px solid rgba(0, 240, 255, .42);
  --app-radius: 2px;
  --app-shadow: 0 0 0 1px rgba(255, 43, 214, .12), 0 0 40px rgba(0, 240, 255, .08);
  --ink: #d9fbff;
  --ink-soft: #9fdfe8;
  --muted: #5e8c99;
  --accent: #00f0ff;
  --note-line: rgba(0, 240, 255, .12);
  --pane-bg: rgba(0, 18, 24, .55);
  --pane-border: 1px solid rgba(0, 240, 255, .22);
  --pane-radius: 0;
  --pane-shadow: inset 0 0 30px rgba(0, 240, 255, .04);
  --control-radius: 0;
  --btn-bg: rgba(0, 240, 255, .05);
  --btn-border: 1px solid rgba(0, 240, 255, .35);
  --primary-bg: linear-gradient(90deg, rgba(0, 240, 255, .95), rgba(255, 43, 214, .9));
  --primary-ink: #031014;
  --primary-shadow: 0 0 24px rgba(0, 240, 255, .35);
  --select-bg: rgba(0, 240, 255, .04);
  --select-border: 1px solid rgba(0, 240, 255, .28);
  --select-shadow: inset 0 0 12px rgba(0, 240, 255, .06);

  --primary-shadow: 0 14px 28px rgba(220, 130, 160, .25);
  --select-bg: rgba(255, 255, 255, .75);
  --select-border: 1px solid rgba(255, 255, 255, .9);
  --select-shadow: 0 4px 10px rgba(190, 120, 150, .08);

  background: linear-gradient(135deg, #ffd7c9 0%, #ffc7d9 50%, #d9c8ff 100%);
}

.m-pastel::before,
.m-pastel::after {
  content: "";
  position: absolute;
  z-index: 0;
  border-radius: 50%;
  filter: blur(40px);
  opacity: .6;
}

.m-pastel::before { width: 260px; height: 260px; right: 40px; top: 40px; background: #ffd7c9; }
.m-pastel::after { width: 220px; height: 220px; left: 30px; bottom: 30px; background: #d9c8ff; }

.m-pastel .app {
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
}

.m-pastel .kicker { color: #c76b88; }
.m-pastel .app-title { letter-spacing: -.02em; }
.m-pastel .win-dots i { background: #ffb7a6; }

</style>
</head>
<body id="top">
  <header class="page-head">
    <div class="page-mark">样张 / 2026.11</div>
    <h1>同一套启动器，<br><span>十种材质。</span></h1>
    <p class="page-lead">10 个方向使用同一套三栏结构和文案，只改变材质、光线、字体与秩序。先看哪种气质适合你的游戏启动器，再把选中的方向做进实际界面；这里只是风格样张。</p>
    <div class="page-meta">
      <span>1080 × 720 桌面窗口样张</span>
      <span>内容相同，便于横向比较</span>
      <span>建议先选 2–3 个方向</span>
    </div>
    <nav class="style-index" id="style-index" aria-label="风格索引"></nav>
  </header>

  <main class="gallery" id="gallery"></main>

  <footer class="page-foot">
    <span>10 个方向 · 纯 CSS 绘制 · 无外部图片</span>
    <a href="#top">回到顶部</a>
  </footer>

  <script>
const STYLES = [
  {
    id: "neumorph",
    name: "新拟态",
    en: "NEUMORPHISM",
    desc: "同色软面板、双向阴影，像一体成型的设备；安静、低刺激，适合长时间停留。",
    colors: ["#e6edf5", "#ffffff", "#c3cedb", "#5b7cfa"],
    extras: ""
  },
  {
    id: "glass",
    name: "玻璃拟态",
    en: "GLASSMORPHISM",
    desc: "紫青渐变、磨砂玻璃与悬浮层次；通透、现代，像一层会发光的界面。",
    colors: ["#2a145c", "#7c4dff", "#00e5ff", "#f7f8ff"],
    extras: ""
  },
  {
    id: "cyber",
    name: "暗黑霓虹",
    en: "CYBERPUNK HUD",
    desc: "深炭底、青色与洋红辉光、网格和角标；战斗 HUD 的紧张感最强。",
    colors: ["#05070a", "#00f0ff", "#ff2bd6", "#00ff9d"],
    extras: ""
  },
  {
    id: "swiss",
    name: "瑞士极简",
    en: "SWISS GRID",
    desc: "黑白、严格网格、一点朱红；没有阴影和圆角，靠秩序和字号建立高级感。",
    colors: ["#f2f1ed", "#ffffff", "#111111", "#e2231a"],
    extras: ""
  },
  {
    id: "leather",
    name: "拟物皮革",
    en: "LEATHER & BRASS",
    desc: "皮革压纹、缝线、黄铜按钮；像一台老派高级音响，厚重、有收藏感。",
    colors: ["#2a160f", "#4a2a1b", "#b98a55", "#e3c07a"],
    extras: ""
  },
  {
    id: "clay",
    name: "3D 软塑",
    en: "CLAYMORPHISM",
    desc: "奶油软塑、大圆角、柔和的体积阴影；友好、轻松，适合降低动作游戏的压迫感。",
    colors: ["#f7efe9", "#ffd9c8", "#cdebd8", "#ded7ff"],
    extras: ""
  },
  {
    id: "memphis",
    name: "孟菲斯波普",
    en: "MEMPHIS",
    desc: "高饱和几何、粗黑描边、错位阴影；80 年代玩心，最活泼、最不怕吵。",
    colors: ["#fff7df", "#ffd23f", "#ff5d8f", "#19c3b1"],
    extras: "<svg class=\"o-squiggle\" viewBox=\"0 0 120 40\" aria-hidden=\"true\"><path d=\"M4 28 C 18 4, 30 4, 42 20 S 66 36, 78 18 S 104 6, 116 24\" fill=\"none\" stroke=\"#111\" stroke-width=\"6\" stroke-linecap=\"round\"/></svg>"
  },
  {
    id: "ink",
    name: "东方水墨",
    en: "INK & PAPER",
    desc: "宣纸、墨线、朱印与大量留白；克制、安静，最贴近战国题材的文化气质。",
    colors: ["#f3eee3", "#f7f2e8", "#1f1c18", "#b23a2f"],
    extras: "<div class=\"o-vertical\">一剑入魂</div><div class=\"o-seal\">鬼</div><div class=\"o-brush\"></div>"
  },
  {
    id: "holo",
    name: "科幻全息",
    en: "HOLOGRAPHIC HUD",
    desc: "深空蓝、透明全息板、雷达与扫描线；未来感强，像在作战界面里启动游戏。",
    colors: ["#020814", "#0a2a4a", "#2f7bff", "#6fe3ff"],
    extras: "<div class=\"o-radar\"></div>"
  },
  {
    id: "pastel",
    name: "治愈渐变",
    en: "SOFT GRADIENT",
    desc: "珊瑚、蜜桃、薰衣草渐变与柔和圆角；温柔、松弛，和硬核剑斗形成反差。",
    colors: ["#ffd7c9", "#ffc7d9", "#d9c8ff", "#ff8a7a"],
    extras: ""
  }
];

const KEY_ROWS = [
  ["移动", ["W", "A", "S", "D"]],
  ["单手攻击", ["鼠标左键"]],
  ["双手攻击", ["R"]],
  ["防御 / 化劲", ["鼠标右键"]],
  ["回避", ["空格"]],
  ["锁定目标", ["鼠标中键"]],
  ["调查", ["F"]],
  ["使用道具", ["Q"]],
  ["菜单", ["Esc"]]
];

function mockupHTML(style) {
  const keys = KEY_ROWS.map(([label, caps]) => `
    <div class="keyrow">
      <span>${label}</span>
      <span class="keys">${caps.map((cap) => `<kbd>${cap}</kbd>`).join("")}</span>
    </div>`).join("");

  return `
  <div class="mockup m-${style.id}">
    <div class="app">
      <div class="winbar">
        <div class="win-dots"><i></i><i></i><i></i></div>
        <div class="win-title">游戏启动器</div>
        <div class="win-meta">启动器</div>
      </div>
      <div class="app-head">
        <div class="app-title">游戏启动器</div>
        <div class="app-sub">YunGame Launcher · GUI Sample</div>
      </div>
      <div class="app-body">
        <aside class="pane pane-left">
          <div class="kicker">关于这款游戏</div>
          <p class="intro">这是一个游戏启动器的三栏界面样张：左边介绍游戏，中间选择启动方式，右边是操作说明。</p>
          <p class="intro">同一套内容只改变材质、光线、字体与秩序，用来比较不同 GUI 风格。</p>
          <div class="left-foot">
            <div class="kicker">玩不了或报错</div>
            <p>点「打开运行日志」<br>把内容发给管理员</p>
          </div>
        </aside>

        <section class="pane pane-center">
          <div class="kicker">启动说明</div>
          <p class="intro">游戏会自动检测画面。</p>
          <div class="field-label">启动选项</div>
          <div class="select">游戏自动检测（推荐）<span class="chev">⌄</span></div>
          <span class="btn btn-primary">启动游戏</span>
          <div class="btn-row">
            <span class="btn">修复分辨率</span>
            <span class="btn">打开运行日志</span>
            <span class="btn">退出</span>
          </div>
        </section>

        <aside class="pane pane-right">
          <div class="kicker">操作说明</div>
          ${keys}
          <p class="small core-tip">核心：敌人攻击瞬间按右键化劲；空格回避；不要贪刀。</p>
        </aside>
      </div>
      <div class="app-foot">
        <span class="status"><i></i>已就绪</span>
        <span class="brand">YunGame</span>
        <span class="hint">游戏退出后本窗口自动关闭</span>
      </div>
    </div>
    ${style.extras}
  </div>`;
}

function render() {
  const gallery = document.getElementById("gallery");
  const index = document.getElementById("style-index");
  const only = new URLSearchParams(location.search).get("style");
  const entries = STYLES
    .map((style, i) => ({ style, no: String(i + 1).padStart(2, "0") }))
    .filter((entry) => !only || entry.style.id === only);

  if (only) document.body.classList.add("single-style");

  index.innerHTML = entries.map(({ style, no }) => {
    return `<a href="#s-${style.id}"><b>${no}</b>${style.name}</a>`;
  }).join("");

  gallery.innerHTML = entries.map(({ style, no }) => {
    const swatches = style.colors.map((color) => `<i style="--c:${color}"></i>`).join("");
    return `
      <section class="style-block" id="s-${style.id}">
        <div class="style-meta">
          <span class="style-no">${no}</span>
          <div class="style-name">
            <h2>${style.name}</h2>
            <span>${style.en}</span>
          </div>
          <p class="style-desc">${style.desc}</p>
          <div class="swatches" aria-hidden="true">${swatches}</div>
        </div>
        <div class="mockup-frame">${mockupHTML(style)}</div>
      </section>`;
  }).join("");
}

function fitMockups() {
  const mobile = window.innerWidth < 900;
  document.querySelectorAll(".mockup-frame").forEach((frame) => {
    const mockup = frame.querySelector(".mockup");
    if (!mockup) return;
    if (mobile) {
      frame.classList.add("is-scroll");
      frame.style.height = "720px";
      mockup.style.transform = "none";
    } else {
      frame.classList.remove("is-scroll");
      const scale = Math.min(1, frame.clientWidth / 1080);
      mockup.style.transform = `scale(${scale})`;
      frame.style.height = `${Math.round(720 * scale)}px`;
    }
  });
}

function watchIndex() {
  const links = Array.from(document.querySelectorAll(".style-index a"));
  if (!("IntersectionObserver" in window)) return;
  const observer = new IntersectionObserver((entries) => {
    entries.forEach((entry) => {
      if (!entry.isIntersecting) return;
      links.forEach((link) => {
        link.classList.toggle("is-active", link.getAttribute("href") === `#${entry.target.id}`);
      });
    });
  }, { rootMargin: "-18% 0px -70% 0px" });
  document.querySelectorAll(".style-block").forEach((section) => observer.observe(section));
}

render();
requestAnimationFrame(() => {
  fitMockups();
  watchIndex();
  if (!document.body.classList.contains("single-style") && location.hash) {
    const target = document.querySelector(location.hash);
    if (target) target.scrollIntoView({ block: "start" });
  }
});
window.addEventListener("resize", () => requestAnimationFrame(fitMockups));

</script>
