[Launcher]
; 使命召唤5：战争世界（Call of Duty: World at War）Treyarch 2008 · 单人战役
; 主程序 CoDWaW.exe（32 位，Direct3D 9）。CoDWaWmp.exe 是联机版，本项目不接反作弊网游。
; 启动方式：只做原生 Direct3D 9 一档（2026-11-10 用户定案：不打 DX 补丁，只做绿色启动、加载存档、自适应桌面分辨率）。
; 存档不在游戏目录也不在注册表：默认 %LOCALAPPDATA%\Activision\CoDWaW\players\profiles\<名>\。
; 绿色解法：启动参数 +set fs_localAppData "<游戏目录>" +set fs_BaseGame "<游戏目录>" 把存档
; 重定向进游戏目录 players\（实测第二次启动起 AppData 零写入），通关存档三件套随游戏目录预置，
; 换电脑自动带过去。r_mode 是 "宽x高" 字符串，启动器每次启动按实测桌面分辨率写（账本 display.state）。
; 注册表：不需要（实测未导入任何键即可运行）。
Title=使命召唤5：战争世界
