Intro=《鬼武者：剑之道》是 CAPCOM 的战国题材动作游戏，以宫本武藏为主角，挥舞太刀与鬼之力斩妖除魔。\n\n战斗讲究一击一杀的紧张感，关卡和演出充满和风与诡异气息。\n\n这份是免安装版，点「启动游戏」即可。\n\n# 玩不了或报错\n点「打开运行日志」，把内容发给管理员
CenterNote=游戏会自动检测画面。
