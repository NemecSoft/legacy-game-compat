[Launcher]
; game_starter.exe 配置；换游戏只改这里，不改代码。
; 可选覆盖键：Intro（左栏游戏介绍）/ Cheats（右栏提示/秘技），用 \n 分行，行首 "# " 是栏内小标题。
Title=暴力摩托 Road Rash 2002
GameExe=Roadrash.exe
GameArgs=
GameProcess=Roadrash
LayerDll=ddraw.dll
LayerIni=ddraw.ini
LayerBackupDir=_cnc-ddraw
SavesDir=各选手1-5级存档
SavePrefix=存档-

; 是否在启动参数里带上选定的存档文件名（游戏自带命令行载入：Roadrash.exe <存档文件>）
; 存档名里不能有空格；自检用假游戏时置 0
AutoLoadSave=1

; 启动门禁：启动器给游戏注入的暗号，和代理 DLL 里的 GATE_ENV/GATE_VAL 要一致。
; 想临时关掉门禁（或回滚）把 GateEnv= 留空即可，不用重新编译。
GateEnv=YUN_GATE_RR
GateVal=RR-GATE-OK

; 门店广告：黄金版带 /ad 参数启动才会弹广告页；钻石版不带参数（或带 /noad）就不弹。
; AdUrl = 广告网页地址。/ad=<网址> 可临时覆盖这里，方便快捷方式写死落地页。
; AdDelay = 打开广告页后停留几秒再进游戏（0~600），给玩家看清广告；0 表示不停留。
AdUrl=https://example.com/ad
AdDelay=5
