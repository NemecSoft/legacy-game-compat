[Launcher]
; 使命召唤8：现代战争3（Call of Duty: Modern Warfare 3）Infinity Ward 2011 · 单人战役
; 主程序 iw5sp.exe（32 位，DX9c）。iw5mp_server.exe 是联机服务端，本项目不接反作弊网游。
; 启动方式：只做原生 Direct3D 9 一档（2026-11-10 用户定案：不打 DXVK、不换 bink、
; 不写键位/语言——汉化包的 binkw32.dll 兼管汉化渲染，动了整屏乱码，不许碰）。
; 配置在 players2\config.cfg（不是 players\，也不是 main\players\）；r_mode 是 "宽x高" 字符串，
; 全屏变量是 r_displayMode "fullscreen"（不是 r_fullscreen）。启动器每次启动按实测桌面分辨率写。
; 注册表：不需要（exe 里没有 Activision/InstallPath 等键名字符串，实测未导入任何键即可运行）。
; 启动自检提示（硬件改变 / 推荐设置 / 安全模式等）：启动器每次启动清 __iw5sp 标记 + 陪跑时自动点掉。
Title=使命召唤8：现代战争3
Subtitle=Call of Duty: Modern Warfare 3 · 单人战役
GameExe=iw5sp.exe
GameArgs=
SafeMark=
LayerDir=_dxvk
LayerFiles=d3d9.dll,dxgi.dll
LayerConf=dxvk.conf
Mode1=1  原生 Direct3D 9
Intro=《使命召唤：现代战争3》\n是 Infinity Ward 2011 年的\n第一人称射击：第三次世界大战，\n从纽约到迪拜到巴黎，\n一路追着马卡洛夫打。\n\n本作是简体中文版，\n进菜单选「战役」开打。\n\n玩法一句：跟队友推进，\n找掩体再探头，\n准星稳了再扣扳机。\n\n# 玩不了或报错\n点「打开运行日志」\n把内容发给我们
CenterNote=游戏会自动检测画面。
ComboHint=启动方式固定为原生 Direct3D 9；如果游戏有异常，点「打开运行日志」把内容发给我们。
