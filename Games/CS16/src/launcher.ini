[Launcher]
; game_starter.exe 配置；换游戏只改这里，不改代码。
; 可选覆盖键：Intro（左栏游戏介绍），用 \n 分行，行首 "# " 是栏内小标题。
Title=反恐精英 Counter-Strike 1.6
GameExe=cstrike.exe
GameArgs=-game cstrike
GameProcess=cstrike
LayerDll=opengl32.dll
LayerIni=
LayerBackupDir=_mesa
TextFixAsi=
ServerExe=hlds.exe
; 基础参数；人数/地图/机器人在启动器里按「一键配置」追加，+servercfgfile 由启动器写
ServerArgs=-game cstrike -console -insecure +sv_lan 1
ServerPort=27015
