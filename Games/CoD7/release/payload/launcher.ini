[Launcher]
; 使命召唤7：黑色行动（Call of Duty: Black Ops）Treyarch 2010 · 简体中文 · 单人战役
; 主程序 BlackOps.exe（32 位，DX9c 引擎）。BlackOpsMP.exe 是多人版，本项目不接反作弊网游，
; 启动器只认单人版，别把 GameExe 改成联机版。
; 启动方式两档，默认第 1 档（界面、本文件、代码三处名字必须一致）：
;   1  DXVK（Vulkan 画面，默认）           根目录放 _dxvk\ 的 d3d9.dll + dxgi.dll + dxvk.conf
;   2  原生 Direct3D 9（没有 Vulkan 的机器） 把根目录那两份移进 _dxvk\禁用\，留底还在 _dxvk\
;      （2026-11-10 实测：原生档独占全屏会被引擎强制回 800x600，能进游戏玩，作兜底档）
; 分辨率自适应：启动器每次启动把实测桌面分辨率写进 players\config.cfg 的 r_mode（DXVK 档下生效，
; 游戏退出会原样写回；display.state 账本记录，玩家在游戏里自己改过就不再动）。
; 上次没正常退出时游戏会在目录根留 4 字节标记 __BlackOps，下次启动弹「Run In Safe Mode?」询问框。
; 启动器静默删掉它（SafeMark 留空 = 按 __ + 主程序名推导），弹了也会被自动点「否」。
Title=使命召唤7：黑色行动
Subtitle=Call of Duty: Black Ops · 简体中文 · 单人战役
GameExe=BlackOps.exe
GameArgs=
; 存档指针自动修（2026-11-10）：引擎每次退出都会把两行 sv_lastSave* 重置回第一关，
; 游戏下次启动就从头开始。启动器每次启动把两行指向最新检查点 + 对应大关（只改这两行、不删存档）。
; 注意：不能用"值变了=玩家改档"的账本判断（引擎重置会误判）；玩家想手动改 config 选旧存档，
; 把下面改成 0，启动器就完全不碰存档指针。
SaveAutoFix=1
; 通关存档配套（2026-11-10）：本作关卡解锁进度在 config 的 mis_01，不在 .svg 里；
; 只把通关 .svg 放进 players\save 是「一关没过」，任务列表全黑条。SaveUnlock=1 每次启动把 mis_01 写 30
; （实测 15 关全显示）；SaveFile 指定通关存档的最终关文件，启动器固定把两行指针指过去，
; 不再按文件时间挑（否则测试写的新检查点会把通关存档挤掉）。文件不存在时自动退回原按时间挑的逻辑。
; 不想要这套（想从头打/自己管进度）：SaveUnlock=0 且 SaveFile 留空。
SaveUnlock=1
SaveFile=save\underwaterbase.svg
SafeMark=
LayerDir=_dxvk
LayerFiles=d3d9.dll,dxgi.dll
LayerConf=dxvk.conf
Mode1=1  DXVK（Vulkan 画面，默认）
Mode2=2  原生 Direct3D 9（没有 Vulkan 的机器）
Intro=《使命召唤：黑色行动》\n是 Treyarch 2010 年的\n第一人称射击：冷战年代，\n秘密行动、回忆与阴谋\n交织的战役。\n\n本作是简体中文版，\n进菜单选「战役」开打。\n\n玩法一句：跟队友推进，\n找掩体再探头，\n准星稳了再扣扳机。\n\n# 玩不了或报错\n点「打开运行日志」\n把内容发给我们
CenterNote=游戏会自动检测画面。
ComboHint=本下拉框的作用是：如果有闪退等异常，换另一种模式，再启动游戏试试。
