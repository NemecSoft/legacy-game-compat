[Launcher]
; 血战上海滩（抗日：血战上海滩）南京祖龙 2003 · Angelica 引擎 · D3D8 · 单人战役
; 主程序 shanghai.exe（32 位）。不带 -windows 直接崩（引擎自己切显示模式，Win11 上
; A3DDevice::Init 报 Can not change display mode!，实机取证），所以 GameArgs 固定带 -windows。
; 默认档「游戏自动检测」：启动器临时把桌面切 800×600@60，游戏窗口正好铺满，退出自动还原；
; 备用档「画面异常时」：桌面一动不动，游戏以 800×600 窗口跑（引擎固定行为）。
; 渲染：系统原生 D3D8（2026-11-15 定案移除兼容层——挂层实测卡死，且目标玩家是不懂电脑的
; 老年人，层出任何问题都是灾难）。桌面还原三重保障：finally + 独立恢复进程 + 未响应看门狗。
; 存档和设置全在游戏目录 ini\ 下，不碰注册表、不碰 AppData，整个目录拷走就带全。
Title=血战上海滩
Subtitle=抗日：血战上海滩 · 单人战役
GameExe=shanghai.exe
GameArgs=
Mode1=游戏自动检测（推荐）
Mode2=画面异常时（固定桌面分辨率）
Intro=《血战上海滩》\n是南京祖龙 2003 年的\n抗日射击游戏：淞沪会战，\n一人一枪打回上海滩，\n是国产游戏的老经典。\n\n本作是简体中文版，\n存档和设置都在\n游戏目录 ini\ 里，\n拷走整个目录都带着。\n\n玩法一句：鼠标瞄准，\n见鬼子就打，\n手雷留给机枪点。\n\n# 玩不了或报错\n点「打开运行日志」\n把内容发给我们
CenterNote=游戏会自动检测画面。
ComboHint=游戏会自动把画面调到最合适；如果游戏有异常，换第二档再启动试试。
