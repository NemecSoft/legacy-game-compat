[Launcher]
; 虐杀原形 2：启动方式与游戏目录 go.bat 一致（直接 prototype2.exe，0x3ff 亲和性）
; go.bat 里的 init.exe 实际上没有运行成功，游戏正常启动不依赖它，这里 RunInit=0。
Title=虐杀原形2 Prototype 2
GameExe=prototype2.exe
GameProcess=prototype2
GameIconExe=prototype2.exe
InitExe=init.exe
RunInit=0
Affinity=3ff
SavesSource=yx\BuDing\cd
SavesTarget=%USERPROFILE%\Documents\Activision\Prototype 2
LayerDll=d3d9.dll
LayerBackupDir=_dxvk
Intro=《虐杀原形2》是 2012 年的\n开放世界动作游戏：\n主角 James Heller 追查病毒，\n吸收敌人、变异出各种能力。\n\n这份是简体中文硬盘版，\n直接进游戏即可。\n\n# 玩不了或报错\n点「打开运行日志」\n把内容发给管理员
EntryGuide=启动后先等加载（第一次较慢）\n过场动画按 Esc / Enter 跳过\n分辨率、画质在游戏「选项」里改
Tips=# 提示\n启动器按游戏原本方式启动，不加参数\n按键以游戏内「选项 → 控制」为准\n存档在 我的文档\\Activision\\Prototype 2
CenterNote=启动器按游戏原本的方式开游戏，\n不改分辨率、不覆盖游戏设置。\n\n第一次进游戏先等加载；\n分辨率、画质请进游戏「选项」里改。\n\n存档：我的文档\\Activision\\Prototype 2
