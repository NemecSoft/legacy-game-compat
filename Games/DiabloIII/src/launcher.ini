[Launcher]
; 暗黑破坏神III 夺魂之镰 终极邪恶版（SanctuaryPort 移植整合版）
; 启动器替代整合包的「开始游戏.exe」：探测 game\CUSA00242（本体）与
; game\CUSA00242-UPDATE（1.47 更新），设 SANCTUARY_* 环境变量后
; 用整合包自带的 python\python.exe 跑 run.py 完整启动链。
; 键位注入（SANCTUARY_KEY_MAP，人体工程学版）：左手移动+喝药，右手全部战斗技能——
; J=✕主攻、K=R2副攻、L=□技能、U/O=△○技能（O 兼菜单返回）、H=L2第四技能、I=R1页签、
; Q=L1药水（左手 WASD 边上不挪手）、Tab=OPTIONS、P/Esc=触摸板左右、F/V/C/B=十字键；
; 闪避锁在右摇杆（按钮表无摇杆项），键盘键固定为方向键。
Title=暗黑破坏神III 夺魂之镰 终极邪恶版
GameExe=python\python.exe
GameArgs=run.py
Intro=《暗黑破坏神III 夺魂之镰》终极邪恶版，暴雪的刷宝经典：\n选职业、下地宫、捡装备。键位按左右手分工排：\n左手 WASD 走位、Q 喝药；右手 J K L U O H 全部技能，方向键翻滚。\n\n这份是 PS4 版的电脑移植整合包，免安装。\n首次启动会准备运行文件和画面缓存，要多等一会儿。\n\n# 玩不了或报错\n点「修复画面」，仍不行就点「打开运行日志」，里面有具体的出错记录
CenterNote=游戏会自动检测画面。
ComboHint=本下拉框的作用是：如果有闪退等异常，换另一种模式，再启动游戏试试。
