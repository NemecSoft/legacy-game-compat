[Launcher]
; 暗黑破坏神III 夺魂之镰 终极邪恶版（SanctuaryPort 移植整合版）
; 启动器替代整合包的「开始游戏.exe」：探测 game\CUSA00242（本体）与
; game\CUSA00242-UPDATE（1.47 更新），设 SANCTUARY_* 环境变量后
; 用整合包自带的 python\python.exe 跑 run.py 完整启动链。
; 键位按战神III重制版方案注入（SANCTUARY_KEY_MAP）：
; J=□技能、K=△技能、L=○技能/返回、空格=✕主要攻击、Q/E=L1/R1、
; U/O=L2/R2、Tab=OPTIONS、P/Esc=触摸板左右、1234=十字键。
Title=暗黑破坏神III 夺魂之镰 终极邪恶版
GameExe=python\python.exe
GameArgs=run.py
Intro=《暗黑破坏神III 夺魂之镰》终极邪恶版，暴雪的刷宝经典：\n选职业、下地宫、捡装备。键位照战神III重制版那套排：\nJ K L 空格 = □△○✕，WASD 走路、方向键翻滚，右手不离键。\n\n这份是 PS4 版的电脑移植整合包，免安装。\n首次启动会准备运行文件和画面缓存，要多等一会儿。\n\n# 玩不了或报错\n点「修复画面」，仍不行就点「打开运行日志」，里面有具体的出错记录
CenterNote=游戏会自动检测画面。
ComboHint=本下拉框的作用是：如果有闪退等异常，换另一种模式，再启动游戏试试。
