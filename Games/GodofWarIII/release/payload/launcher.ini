[Launcher]
; 战神III 重制版（God of War III Remastered / SpartanPort 移植版）
; 启动器替代原版「游戏设置.exe」：把按键方案写进 settings.json，
; 画面兜底写进 spartanport.ini，再用 SpartanPort.exe --run + SPARTAN_* 环境变量拉起游戏。
Title=战神III 重制版
GameExe=SpartanPort.exe
GameArgs=--run
Intro=《战神III 重制版》是圣莫尼卡的动作冒险经典，奎托斯踏上天界与冥界，向众神展开最后的复仇。连招、QTE 与巨怪 Boss 战是它的招牌。\n\n这份是免安装移植版，存档在本目录 user 文件夹里。\n首次启动会准备着色器，需要等一两分钟。\n\n# 玩不了或报错\n点「修复画面」，仍不行就点「打开运行日志」，把内容发给管理员
CenterNote=游戏会自动检测画面。
