[Launcher]
; 幽灵行动：未来战士 v1.8 全 DLC 简体中文版
; 启动链：init.exe -> Future Soldier.exe "Future Soldier DX11.exe"
; 不运行 go.bat（它会写 XP 兼容性 + RUNASADMIN）；不带亲和性/分辨率参数。
Title=幽灵行动：未来战士
GameExe=Future Soldier.exe
GameArgs="Future Soldier DX11.exe"
GameProcess=Future Soldier DX11
GameIconExe=Future Soldier DX11.exe
InitExe=init.exe
RunInit=1
Affinity=0
LayerDll=
LayerBackupDir=
Intro=《幽灵行动：未来战士》是 Ubisoft 2012 年的\n第三人称战术射击游戏：\n四人小队执行潜入、侦察\n和火力打击任务。\n\n这份是 v1.8 全 DLC 简体中文版，\nDX11 原生渲染，直接进游戏即可。\n\n# 玩不了或报错\n点「打开运行日志」\n把内容发给管理员
EntryGuide=启动后先等加载（第一次较慢）\n过场动画按 Esc / Enter 跳过\n画面、按键在游戏「选项」里改\n不要再用 go.bat（它会写 XP 兼容性）
Tips=# 提示\n启动器按 DX11 方式启动，不加参数\n按键以游戏内「选项 → 控制」为准\n修改器是 Themida 加壳，Win11 开了\n内存完整性/VBS 会被反虚拟机检测拦住\n（详见 修改器说明.txt）
CenterNote=启动器按 DX11 原生方式开游戏，\n不改分辨率、不覆盖游戏设置。\n\n第一次进游戏先等加载；\n分辨率、画质请进游戏「选项」里改。\n\n修改器限制请看右侧提示。
