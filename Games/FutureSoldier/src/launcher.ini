[Launcher]
; 幽灵行动：未来战士 v1.8 全 DLC 简体中文版
; 启动方式 1：init.exe -> Future Soldier.exe "Future Soldier DX11.exe"（DX11 原生，默认）
; 启动方式 2：同上改为 DX9.exe，并只在本次进程树设置 WINXPSP3 让启动器选 DX9，
;              d3d9.dll 用 DXVK 2.5.3；不写注册表、不运行 go.bat。
Title=幽灵行动：未来战士
GameExe=Future Soldier.exe
GameArgs="Future Soldier DX11.exe"
GameProcess=Future Soldier DX11
GameIconExe=Future Soldier DX11.exe
InitExe=init.exe
RunInit=1
Affinity=0
LayerDll=
LayerBackupDir=
Intro=《幽灵行动：未来战士》是 Ubisoft 2012 年的\n第三人称战术射击游戏：\n四人小队执行潜入、侦察\n和火力打击任务。\n\n这份是 v1.8 全 DLC 简体中文版，\n直接进游戏即可。\n\n# 玩不了或报错\n点「打开运行日志」\n把内容发给管理员
EntryGuide=启动后先等加载（第一次较慢）\n过场动画按 Esc / Enter 跳过\n默认 DX11；进不去选 DX9（老机器）\n画面、按键在游戏「选项」里改\n不要再用 go.bat
Tips=# 提示\n默认 DX11，画质更好\n老机器 / 进不去选 DX9\nDX9 模式左上角会显示帧数\n按键以游戏内「选项 → 控制」为准\n修改器在 Win11 可能被安全功能拦住\n（详见 修改器说明.txt）
CenterNote=默认 DX11（画质最好）；\n进不去时，在「启动方式」里改选 DX9（老机器）。\n\n不改分辨率、不覆盖游戏设置。\n第一次进游戏先等加载；\n分辨率、画质请进游戏「选项」里改。\n\n修改器限制请看右侧提示。
