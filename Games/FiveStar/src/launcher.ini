[Launcher]
; 绝命时刻：五星之光（Command & Conquer: Generals – Zero Hour 国产模组）
; 兼容层：DXVK 2.5.3（d3d8.dll + d3d9.dll）；启动器直接启动 generals.exe。
Title=绝命时刻：五星之光
GameExe=generals.exe
GameArgs=
GameProcess=Game.dat
GameIconExe=generals.exe
InitExe=
RunInit=0
Affinity=0
LayerDll=d3d8.dll
LayerBackupDir=_dxvk
Intro=《绝命时刻：五星之光》是经典即时战略\n《命令与征服：将军——绝命时刻》的国产模组：\n新增中国阵营、单位、战役和地图。\n\n这份是五星之光 Huixian 独立安装版\nV1.3 简体中文版，直接进游戏即可。\n\n# 玩不了或报错\n点「打开运行日志」\n把内容发给管理员
EntryGuide=第一次进游戏加载较慢\n先在启动器里选画面方案和亮度\n左键选择，右键移动/攻击\n游戏内「选项」还能继续调画质
Tips=# 提示\n默认 1920×1080 高画质（推荐），约 60 帧\n老机器或卡顿选中/低画质\n启动器会自动完成注册和画质写入\n游戏内设置以游戏「选项」为准
CenterNote=先选画面方案和亮度，再点启动。\n启动器会自动写入游戏注册表，\n并把画质设置写进游戏选项；\n不会覆盖存档和玩家按键。\n\n点「算号并注册」可重新生成序列号。
