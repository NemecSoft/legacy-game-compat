[Launcher]
; 使命召唤2（Call of Duty 2）3dm 繁体中文汉化 1.3 版 · 单人战役
; 主程序 CoD2SP_s.exe（32 位，版本串 pc_1.3_1_1）。CoD2MP_s.exe 带 PunkBuster 反作弊，
; 本项目不接反作弊网游，启动器只认单人版，别把 GameExe 改成联机版。
; 启动方式两档，默认第 1 档（界面、本文件、代码三处名字必须一致）：
;   1  DXVK（Vulkan 画面，默认）           根目录放 _dxvk\ 的 d3d9.dll + dxgi.dll + dxvk.conf
;   2  原生 Direct3D 9（没有 Vulkan 的机器） 把根目录那两份移进 _dxvk\禁用\，留底还在 _dxvk\
; 游戏的画面设置由引擎自己读写 main\players\3dm\config.cfg，启动器不碰它，玩家改的分辨率/按键都留着。
Title=使命召唤2
Subtitle=Call of Duty 2 · 1.3 汉化版 · 单人战役
GameExe=CoD2SP_s.exe
GameArgs=
; 上次没正常退出时游戏会在目录根留这个 4 字节标记，下次启动弹繁体 Big5 的「安全模式」询问框
; （简化字系统上是乱码），选「是」还会 exec safemode.cfg 把画面降回 640×480。启动器静默删掉它。
SafeMark=__CoD2SP_s
LayerDir=_dxvk
LayerFiles=d3d9.dll,dxgi.dll
LayerConf=dxvk.conf
Mode1=1  DXVK（Vulkan 画面，默认）
Mode2=2  原生 Direct3D 9（没有 Vulkan 的机器）
Intro=《使命召唤2》是 Infinity Ward\n2005 年的二战第一人称射击：\n诺曼底、北非、斯大林格勒到柏林，\n四名士兵轮流上阵打完整场战役。\n\n本作是 3dm 繁体中文汉化 1.3 版，\n菜单是繁体字，认得出就行。\n\n玩法一句：找掩体、探头，\n按住屏息稳住准星再开枪。\n\n# 玩不了或报错\n点「打开运行日志」\n把内容发给我们
CenterNote=游戏会自动检测画面。
ComboHint=本下拉框的作用是：如果有闪退等异常，换另一种模式，再启动游戏试试。
; 中栏只留上面这几句（技能「中栏布局：一叠垂直居中，不留大空洞」），不再加第三块说明文字。
