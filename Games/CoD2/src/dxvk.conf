# 使命召唤2（CoD2SP_s.exe，32 位 Direct3D 9）+ DXVK 2.6.2 x86 配置
# 这份文件放在游戏目录根，游戏加载根目录那份 d3d9.dll（= DXVK）时会读它；
# _dxvk\dxvk.conf 是同一份留底，两边必须逐字节一致（build.ps1 负责复制，收尾自检负责比对）。
# 2026-11-10 从 2.5.3 升 2.6.2：电竞酒店 RTX 5080 客户机跑 90s 栈溢出 0xC00000FD（坑 118）。
# 选 2.6.2 不选 2.7：2.6.1 修 NVIDIA 新卡描述堆 OOM 崩溃（#5855）、2.6 修 32 位 NVIDIA
# 驱动描述堆问题，正对 RTX 5080；2.7 硬性要求 VK_KHR_maintenance5，本机 RX 580 实测 6s
# 崩 0xC0000409（ucrtbase fail-fast）不能交付，已弃。本机 2.6.2 实测 100s+ 稳定。
# 2.6.2 留底在仓库 tools\dxvk\x86-2.6.2（CoD2 专用）。

# 规则 11：交付只显示帧数。玩家在游戏里看到左上角的 FPS，才说明兼容层真的挂上了。
# 排障取证时才临时改成 dxvk.hud = version,api,fps，查完改回 fps（水印证据只留在仓库 evidence\）。
dxvk.hud = fps

# 交付时不在玩家目录留 DXVK 流水日志。
# 实测（2026-11-09 扫留底 d3d9.dll / dxgi.dll 里的配置键；2026-11-10 升 2.7 后同样成立）：DXVK 的
# dxvk.conf 没有 dxvk.logLevel 这一项，日志级别只认环境变量 DXVK_LOG_LEVEL、落盘目录只认 DXVK_LOG_PATH。
# 所以下面这行留着当备注、但保持注释状态——写了也不会生效，还会让玩家以为日志被关掉了：
# dxvk.logLevel = err
# 真正做的事：game_starter.exe 在拉起游戏前，只给「这一个游戏进程」设 DXVK_LOG_LEVEL=error，
# 进程退出即消失，不写系统环境变量、不动其他程序。
# 要完整流水时（远程排障）：game_starter.exe /go /dxlog=info（只对本次启动生效）。
