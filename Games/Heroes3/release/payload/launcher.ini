[Launcher]
; 英雄无敌3：死亡阴影 v3.1 简体中文版
; 兼容层：cnc-ddraw 7.1（ddraw.dll），GDI 软件渲染；启动器只切换 _presets\ddraw*.ini。
Title=英雄无敌3：死亡阴影
GameExe=Heroes3.exe
GameArgs=
GameProcess=Heroes3
GameIconExe=Heroes3.exe
InitExe=
RunInit=0
Affinity=0
LayerDll=ddraw.dll
LayerBackupDir=_cnc-ddraw
Intro=《英雄无敌3：死亡阴影》是 New World Computing\n1999 年的回合制策略经典：招募英雄、经营城镇、\n探索地图，用魔法和兵种打一场场战役。\n\n这份是 v3.1 简体中文完整版，\n直接进游戏即可。\n\n# 玩不了或报错\n点「打开运行日志」\n把内容发给管理员
EntryGuide=启动后先等加载（第一次较慢）\n想换窗口用启动器的「窗口模式」\n画面异常换「保持 4:3」或「窗口」\n多人：游戏内选 IPX 或 TCP/IP\n联机组件已带好，不用另装
Tips=# 提示\n默认 GDI（最兼容），画面最稳\n黑屏/花屏时优先选 GDI 稳定全屏或窗口\n其他画面方式在本游戏容易出问题，别手动改\n花屏/黑屏先关远程软件、HDR、覆盖层\n高刷屏已经处理过，不用再调
CenterNote=默认「稳定全屏（GDI）」最兼容；\n人物被拉胖选「保持 4:3」，\n黑屏/切屏问题选「窗口模式」，\n老机器想原汁原味\n选「原版 640×480（窗口）」。\n\n启动器只切换显示方式，不改存档。
