[Launcher]
; 英雄无敌3：死亡阴影 v3.1 简体中文版
; 显示方式六档：1-4 软件画面 GDI、5 DX9 硬件加速、6 dgVoodoo2 转换（默认第 6 档，无边框全屏）。
; dgVoodoo2 全屏那一变体实测 DDERR_INVALIDRECT(456) 已判死，见仓库 references\do-not-retry.md。
; 启动器只切换 _presets\ 里的配置和顶在 ddraw.dll 位置的层，不改游戏其它文件；
; 60Hz 是无条件处理（启动前设、退出后还原），这里没有开关。
Title=英雄无敌3：死亡阴影
GameExe=Heroes3.exe
GameArgs=
GameProcess=Heroes3
Affinity=0
LayerDll=ddraw.dll
LayerBackupDir=_cnc-ddraw
Intro=《英雄无敌3：死亡阴影》是 New World Computing\n1999 年的回合制策略经典：招募英雄、经营城镇、\n探索地图，用魔法和兵种打一场场战役。\n\n这份是 v3.1 简体中文完整版，\n直接进游戏即可。\n\n# 玩不了或报错\n点「打开运行日志」\n把内容发给我们
CenterNote=1  软件画面 GDI（全屏）\n2  软件画面 GDI（4:3黑边）\n3  软件画面 GDI（窗口1280×720）\n4  原版640×480（窗口）\n5  DX9硬件加速（全屏）\n6  dgVoodoo2转换（无边框全屏）
