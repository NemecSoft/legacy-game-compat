[Launcher]
; 英雄无敌3：死亡阴影 v3.1 简体中文版
; 显示方式两条通道六档：cnc-ddraw 7.1（GDI 软件画面 / DX9硬件加速）与 dgVoodoo2（转译）。
; 启动器只切换 _presets\ 里的配置和顶在 ddraw.dll 位置的层，不改游戏其它文件。
Title=英雄无敌3：死亡阴影
GameExe=Heroes3.exe
GameArgs=
GameProcess=Heroes3
GameIconExe=Heroes3.exe
InitExe=
RunInit=0
Affinity=0
LayerDll=ddraw.dll
LayerBackupDir=_cnc-ddraw
Intro=《英雄无敌3：死亡阴影》是 New World Computing\n1999 年的回合制策略经典：招募英雄、经营城镇、\n探索地图，用魔法和兵种打一场场战役。\n\n这份是 v3.1 简体中文完整版，\n直接进游戏即可。\n\n# 玩不了或报错\n点「打开运行日志」\n把内容发给管理员
EntryGuide=启动后先等加载（第一次较慢）\n默认第 6 档 dgVoodoo2转换\n想切窗口选第 3 档\n多人：游戏内选 IPX 或 TCP/IP\n联机组件已带好，不用另装
Tips=# 提示\n默认第 6 档：dgVoodoo2转换\n黑屏/花屏先回第 1 档，再试窗口档\n备选：DX9硬件加速、\ndgVoodoo2转换（无边框全屏）\n花屏/黑屏先关远程软件、HDR、覆盖层\n高刷屏已经处理过，不用再调
CenterNote=共 6 档，默认第 6 档 dgVoodoo2转换（无边框全屏）。\n画面不对往上回：5 DX9硬件加速、1 软件画面 GDI，\n要窗口选 3 或 4。\n\n启动器只切换显示方式，不改存档。
